name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evtap
          POSTGRES_PASSWORD: evtap
          POSTGRES_DB: evtap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evtap" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://evtap:evtap@localhost:5432/evtap
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - name: Create mock bank test database
        run: PGPASSWORD=evtap psql -h localhost -U evtap -c "create database mockbank;" -c "create database mockbank_dev;"
      - run: pnpm -r typecheck
      - run: pnpm --filter @evtap/api build
      - run: pnpm --filter @evtap/mockbank build
      - run: pnpm --filter @evtap/web build
      - run: pnpm --filter @evtap/admin build
      - run: pnpm --filter @evtap/api db:migrate
      - run: pnpm --filter @evtap/api db:seed
        env: { SEED_IMAGES: local }
      - run: pnpm --filter @evtap/mockbank test
        env: { DATABASE_URL: postgres://evtap:evtap@localhost:5432/mockbank_dev }
      - name: Start API for live tests
        working-directory: apps/api
        run: |
          nohup node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health && break; sleep 1; done
      - run: pnpm --filter @evtap/api test
        env: { API_URL: http://localhost:4000 }
      - name: API log on failure
        if: failure()
        run: tail -100 /tmp/api.log || true
      - run: pnpm --filter @evtap/mobile exec expo export --platform android --output-dir /tmp/expo-android
